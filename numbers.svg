<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150" role="img" aria-label="Mahmoud Yousry by the numbers" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#00D9C0"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .in  { animation: up .8s ease-out both; }
    .fl  { animation: float 5s ease-in-out infinite; }
    .i1 { animation-delay: .0s; } .i2 { animation-delay: .15s; }
    .i3 { animation-delay: .3s; } .i4 { animation-delay: .45s; }
    .f2 { animation-delay: -1.2s; } .f3 { animation-delay: -2.4s; } .f4 { animation-delay: -3.6s; }
    @keyframes up    { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g class="in i1"><g class="fl">
    <rect x="30" y="20" width="170" height="110" rx="18" fill="#161B22" stroke="url(#brand)" stroke-width="1.5"/>
    <text x="115" y="75" font-size="36" font-weight="800" fill="url(#brand)" text-anchor="middle">1.5+</text>
    <text x="115" y="102" font-size="13" fill="#C9D1D9" text-anchor="middle">Years of experience</text>
  </g></g>

  <g class="in i2"><g class="fl f2">
    <rect x="220" y="20" width="170" height="110" rx="18" fill="#161B22" stroke="url(#brand)" stroke-width="1.5"/>
    <text x="305" y="75" font-size="36" font-weight="800" fill="url(#brand)" text-anchor="middle">8+</text>
    <text x="305" y="102" font-size="13" fill="#C9D1D9" text-anchor="middle">Mobile apps built</text>
  </g></g>

  <g class="in i3"><g class="fl f3">
    <rect x="410" y="20" width="170" height="110" rx="18" fill="#161B22" stroke="url(#brand)" stroke-width="1.5"/>
    <text x="495" y="75" font-size="36" font-weight="800" fill="url(#brand)" text-anchor="middle">5</text>
    <text x="495" y="102" font-size="13" fill="#C9D1D9" text-anchor="middle">Hajj ecosystem apps</text>
  </g></g>

  <g class="in i4"><g class="fl f4">
    <rect x="600" y="20" width="170" height="110" rx="18" fill="#161B22" stroke="url(#brand)" stroke-width="1.5"/>
    <text x="685" y="75" font-size="36" font-weight="800" fill="url(#brand)" text-anchor="middle">3</text>
    <text x="685" y="102" font-size="13" fill="#C9D1D9" text-anchor="middle">State management tools</text>
  </g></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
